[project]
name = "vulnerability-patching-harness"
version = "0.1.0"
description = "Offline, deterministic evaluation of simulated vulnerability remediations"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2,<3",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
